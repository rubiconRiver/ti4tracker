version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ti4tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ti4tracker
      POSTGRES_PASSWORD: ti4tracker_dev
      POSTGRES_DB: ti4tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ti4tracker -d ti4tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js Application (for production/testing)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ti4tracker-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ti4tracker:ti4tracker_dev@postgres:5432/ti4tracker
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
